<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#346b50"><meta name="description" content="Mi Norte: organización personal y profesional"><link rel="manifest" href="manifest.webmanifest"><title>Mi Norte</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263c31;background:#f7f4ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fffdf8;border-bottom:1px solid #e5e5d9;position:sticky;top:0;z-index:3}.head{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:13px 18px}.brand{font-size:23px;font-weight:800;color:#346b50}.muted{color:#708176;font-size:13px}.shell{max-width:1080px;margin:auto;display:grid;grid-template-columns:210px 1fr;gap:22px;padding:22px 16px 80px}nav{display:flex;flex-direction:column;gap:8px}nav button{border:0;text-align:left;padding:13px;border-radius:13px;background:transparent;color:#41574b}nav button.active{background:#e2ede2;color:#255d40;font-weight:700}main{min-width:0}.panel{background:#fffefa;border:1px solid #e5e8dc;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #253e2a08}.hero{background:linear-gradient(130deg,#e0eee1,#f7f3df)}h1{font-size:27px;margin:5px 0 10px}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.5}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:14px;background:#f1f5ec;border-radius:14px}.metric b{font-size:25px;display:block}.btn{border:0;background:#346b50;color:white;padding:11px 15px;border-radius:11px;font-weight:650}.btn.secondary{background:#e8efe7;color:#2c6248}.btn.ghost{background:transparent;color:#55745f}.btn.danger{background:#f8e7e2;color:#8c4335}input,select,textarea{background:#fff;border:1px solid #d4dfd2;border-radius:10px;padding:11px;width:100%;color:#283f31}textarea{min-height:75px;resize:vertical}label{display:block;font-size:13px;font-weight:650;margin:8px 0 5px}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0e9}.task:last-child{border-bottom:0}.task input[type=checkbox]{width:20px;height:20px;accent-color:#3c7756;flex:none}.task .body{flex:1;min-width:0}.task.done .body{text-decoration:line-through;color:#829087}.tag{font-size:11px;border-radius:20px;padding:5px 8px;background:#edf1e9;white-space:nowrap}.high{background:#fae5df;color:#a34838}.medium{background:#fff0d6;color:#986719}.low{background:#e2f1e7;color:#367550}.hidden{display:none!important}.pill{padding:7px 11px;border-radius:20px;background:#e9f0e6;font-size:12px}.empty{padding:20px;text-align:center;color:#708176}.note{border-left:3px solid #a7c4a6;padding:9px 12px;background:#f2f7ef;border-radius:5px;font-size:13px}.steps{display:grid;gap:9px}.step{padding:13px;border-radius:12px;background:#f3f6ee}.step b{display:block;margin-bottom:4px}.footer{font-size:12px;color:#738278}.status{font-size:12px;background:#e8f0e7;border-radius:20px;padding:6px 10px}details{margin-top:10px}summary{cursor:pointer;font-weight:650}#toast{position:fixed;bottom:20px;right:20px;background:#315d47;color:white;padding:12px 17px;border-radius:12px;display:none;z-index:10;max-width:90vw} @media(max-width:700px){.shell{display:block;padding:14px 12px 90px}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;flex-direction:row;justify-content:space-around;background:#fffefa;border-top:1px solid #e5e8dc;padding:7px 3px env(safe-area-inset-bottom);gap:0}nav button{font-size:11px;padding:9px 5px;text-align:center;border-radius:8px}.panel{padding:15px}.grid{grid-template-columns:1fr}h1{font-size:23px}.head{padding:11px 14px}.task{flex-wrap:wrap}.task .actions{width:100%;justify-content:flex-end}}
</style></head><body><header><div class="head"><div><div class="brand">🌿 Mi Norte</div><div class="muted">Un paso a la vez</div></div><span class="status" id="connection">● Comprobando conexión</span></div></header><div class="shell"><nav id="nav"><button data-page="inicio" class="active">🏡 Inicio</button><button data-page="tareas">☑️ Tareas</button><button data-page="personal">🌱 Mi crecimiento</button><button data-page="profesional">🗓️ Profesional</button><button data-page="ajustes">⚙️ Ajustes</button></nav><main id="content"></main></div><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s);const dateLocal=(d=new Date())=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const today=()=>dateLocal();const tomorrow=()=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+1);return dateLocal(d)};const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,state,page='inicio';const initial=()=>({tasks:[],habits:[{id:uid(),name:'Tomar agua',done:''},{id:uid(),name:'Caminar 10 minutos',done:''},{id:uid(),name:'Leer una página',done:''}],problems:[],clients:[],obligations:[],journal:[],settings:{reviewHour:'20:30'}});
async function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open('mi-norte-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function load(){db=await openDb();state=await new Promise((res,rej)=>{let tx=db.transaction('data','readonly'),q=tx.objectStore('data').get('state');q.onsuccess=()=>res(q.result||initial());q.onerror=()=>rej(q.error)});render()}async function save(){return new Promise((res,rej)=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').put(state,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function change(fn){fn();await save();render()}function toast(s){let el=$('#toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-PY',{day:'2-digit',month:'short',year:'numeric'}):'Sin fecha'}function priority(t){return t.priority==='alta'?3:t.priority==='media'?2:1}function sortedTasks(){return [...state.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||priority(b)-priority(a)||(a.date||'9999').localeCompare(b.date||'9999'))}function dueTasks(){return sortedTasks().filter(t=>!t.done&&(!t.date||t.date<=today()))}function taskHTML(t,withActions=true){return `<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Completar tarea" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="body"><b>${escapeHtml(t.title)}</b><div class="muted">${escapeHtml(t.area)} · ${fmt(t.date)}${t.clientId?' · Cliente asociado':''}</div></div><span class="tag ${t.priority==='alta'?'high':t.priority==='media'?'medium':'low'}">${escapeHtml(t.priority)}</span>${withActions?`<div class="row actions"><button class="btn ghost" onclick="moveTask('${t.id}')">↪ Mañana</button><button class="btn ghost" onclick="editTask('${t.id}')">Editar</button><button class="btn ghost" onclick="deleteTask('${t.id}')">✕</button></div>`:''}</div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='inicio'){let due=dueTasks(),done=state.tasks.filter(t=>t.done&&t.finished===today()).length;html=`<section class="panel hero"><div class="muted">${new Date().toLocaleDateString('es-PY',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Hoy, un paso a la vez.</h1><p>Elegí lo importante. No necesitás resolverlo todo de golpe.</p><div class="grid"><div class="metric"><b>${due.length}</b><span>Pendientes de hoy o atrasadas</span></div><div class="metric"><b>${done}</b><span>Completadas hoy</span></div></div></section><section class="panel"><div class="row between"><h2>Tus prioridades</h2><button class="btn secondary" onclick="go('tareas')">Ver tareas</button></div>${due.length?due.slice(0,5).map(t=>taskHTML(t,false)).join(''):'<div class="empty">No tenés tareas urgentes. Podés dedicarte a un hábito.</div>'}</section><section class="panel"><h2>Tu pequeño paso de hoy</h2><p>Si algo parece enorme, hacé solamente los primeros dos minutos. Empezar ya es avanzar.</p><button class="btn secondary" onclick="go('personal')">🌱 Ir a mi crecimiento</button></section><section class="panel"><h2>Cierre del día</h2><p class="muted">Revisá tus pendientes y decidí qué continúa mañana.</p><button class="btn" onclick="go('tareas');document.getElementById('review').open=true">🌙 Revisar mi día</button></section>`}
if(page==='tareas'){html=`<section class="panel"><h1>Mis tareas</h1><form id="taskForm"><label>¿Qué necesitás hacer?</label><input name="title" maxlength="180" required placeholder="Ej. Preparar informe de IVA"><div class="grid"><div><label>Importancia</label><select name="priority"><option value="alta">🔴 Alta</option><option value="media" selected>🟠 Media</option><option value="baja">🟢 Baja</option></select></div><div><label>Fecha prevista</label><input name="date" type="date" value="${today()}"></div><div><label>Área</label><select name="area"><option>Personal</option><option>Profesional</option></select></div><div><label>Cliente (opcional)</label><select name="clientId"><option value="">Sin cliente</option>${state.clients.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div></div><button class="btn" style="margin-top:13px">＋ Agregar tarea</button></form></section><section class="panel"><h2>Ordenadas por importancia y fecha</h2>${state.tasks.length?sortedTasks().map(t=>taskHTML(t)).join(''):'<div class="empty">Todavía no cargaste tareas.</div>'}</section><section class="panel"><details id="review"><summary>🌙 Revisión de fin del día</summary><p>Las tareas no terminadas pueden pasar a mañana. Las obligaciones tributarias conservan su vencimiento legal.</p><label>¿Cómo te sentiste hoy?</label><select id="mood"><option>Bien</option><option>Regular</option><option>Difícil</option></select><label>Algo que lograste o aprendiste</label><textarea id="reflection" placeholder="Un avance pequeño también cuenta..."></textarea><div class="row"><button class="btn" onclick="closeDay()">Guardar revisión y pasar pendientes a mañana</button></div><p class="muted">Podés editar individualmente la fecha de cualquier tarea antes de cerrar el día.</p></details></section>`}
if(page==='personal'){const steps=[['Nombrar el problema','Describí qué sucede concretamente, sin juzgarte.'],['Empezar sin esperar ganas','Elegí una acción de dos minutos.'],['Cuidar la base','Sueño, agua, comida, movimiento y espacio.'],['Hacerlo pequeño','Dividí las tareas grandes en pasos sencillos.'],['Reducir lo que drena','Identificá distracciones y límites necesarios.'],['Crear sistemas','Asociá hábitos nuevos con rutinas existentes.'],['Retomar sin castigo','Un día difícil no borra tus avances.']];let readings=[['Meditaciones — Marco Aurelio','¿Qué parte de tu preocupación depende de tus acciones?'],['Hábitos atómicos — James Clear','¿Cómo harías más fácil empezar una tarea?'],['El hombre en busca de sentido — Viktor Frankl','¿Qué pequeño propósito merece tu atención hoy?'],['Autocompasión — Kristin Neff','¿Qué le dirías a un amigo en tu situación?']];let r=readings[new Date().getDate()%readings.length];html=`<section class="panel hero"><h1>🌱 Mi crecimiento</h1><p>Progreso amable, con acciones pequeñas y constantes.</p></section><section class="panel"><h2>Hábitos de hoy</h2>${state.habits.map(h=>`<div class="task"><input type="checkbox" ${h.done===today()?'checked':''} onchange="toggleHabit('${h.id}',this.checked)"><div class="body">${escapeHtml(h.name)}</div><button class="btn ghost" onclick="removeHabit('${h.id}')">✕</button></div>`).join('')}<form id="habitForm" class="row" style="margin-top:12px"><input name="name" required placeholder="Nuevo hábito" style="flex:1;min-width:170px"><button class="btn">Añadir</button></form></section><section class="panel"><h2>Lectura y reflexión del día</h2><h3>${escapeHtml(r[0])}</h3><p>${escapeHtml(r[1])}</p><p class="muted">Sugerencia temática; no reproduce fragmentos del libro.</p></section><section class="panel"><h2>Mis problemas concretos</h2><form id="problemForm"><label>¿Qué está pasando?</label><textarea name="problem" required placeholder="Ej. Tengo tres trabajos atrasados..."></textarea><label>¿Cuál es el primer paso pequeño?</label><input name="step" required placeholder="Ej. Revisar el primer archivo"><button class="btn" style="margin-top:10px">Guardar problema</button></form>${state.problems.map(p=>`<div class="step" style="margin-top:10px"><b>${escapeHtml(p.problem)}</b><div class="muted">Primer paso: ${escapeHtml(p.step)}</div><button class="btn ghost" onclick="problemToTask('${p.id}')">Crear tarea de este paso</button><button class="btn ghost" onclick="removeProblem('${p.id}')">✕</button></div>`).join('')}</section><section class="panel"><h2>Los 7 pasos de Palitos</h2><div class="steps">${steps.map((s,i)=>`<div class="step"><b>${i+1}. ${s[0]}</b>${s[1]}</div>`).join('')}</div></section>`}
if(page==='profesional'){html=`<section class="panel hero"><h1>🗓️ Mi Norte Profesional</h1><p>Tu espacio privado para clientes, trabajos y obligaciones.</p><div class="note">Versión inicial: registro manual de obligaciones. Las fechas calculadas automáticamente y las alertas normativas se habilitarán tras verificar el calendario DNIT vigente y sus excepciones.</div></section><section class="panel"><h2>Registrar cliente</h2><form id="clientForm"><label>Nombre o razón social</label><input name="name" required maxlength="150"><label>RUC (incluido dígito verificador)</label><input name="ruc" required pattern="[0-9]+-[0-9]" placeholder="1234567-8"><button class="btn" style="margin-top:12px">Agregar cliente</button></form>${state.clients.map(c=>`<div class="task"><div class="body"><b>${escapeHtml(c.name)}</b><div class="muted">RUC: ${escapeHtml(c.ruc)}</div></div><button class="btn ghost" onclick="deleteClient('${c.id}')">✕</button></div>`).join('')}</section><section class="panel"><h2>Registrar obligación</h2><form id="obligationForm"><label>Cliente</label><select name="clientId" required><option value="">Seleccionar</option>${state.clients.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select><div class="grid"><div><label>Obligación</label><select name="type"><option>IVA</option><option>IRE General</option><option>IRE SIMPLE</option><option>IRE RESIMPLE</option><option>IRP</option><option>IDU</option><option>ISC</option><option>Retenciones</option><option>Anticipos</option><option>Declaración informativa</option><option>Registro de comprobantes</option><option>Otra</option></select></div><div><label>Período fiscal</label><input name="period" required placeholder="2026-10"></div><div><label>Vencimiento verificado</label><input name="due" type="date" required></div><div><label>Estado</label><select name="status"><option>Pendiente</option><option>Preparada</option><option>Presentada</option><option>Pagada</option></select></div></div><button class="btn" style="margin-top:12px">Guardar obligación</button></form></section><section class="panel"><h2>Próximos vencimientos registrados</h2>${state.obligations.length?[...state.obligations].sort((a,b)=>a.due.localeCompare(b.due)).map(o=>{let c=state.clients.find(c=>c.id===o.clientId);return `<div class="task"><div class="body"><b>${escapeHtml(o.type)} · ${escapeHtml(c?.name||'Cliente eliminado')}</b><div class="muted">Período ${escapeHtml(o.period)} · ${fmt(o.due)}</div></div><select style="width:auto" onchange="updateObligation('${o.id}',this.value)">${['Pendiente','Preparada','Presentada','Pagada'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost" onclick="deleteObligation('${o.id}')">✕</button></div>`}).join(''):'<div class="empty">No hay obligaciones registradas.</div>'}</section>`}
if(page==='ajustes'){html=`<section class="panel"><h1>⚙️ Ajustes y seguridad</h1><p>Los datos se guardan en este dispositivo mediante IndexedDB. No se envían a un servidor.</p><div class="note">Esta versión es una prueba personal local, sin autenticación ni separación real de cuentas. No la compartas con terceros ni la uses para almacenar información tributaria sensible en dispositivos compartidos.</div><label>Hora deseada de revisión (recordatorio visual futuro)</label><input type="time" id="reviewHour" value="${state.settings.reviewHour}"><button class="btn secondary" style="margin-top:10px" onclick="saveHour()">Guardar hora</button></section><section class="panel"><h2>Respaldo de datos</h2><p>Exportá un archivo JSON y guardalo en un lugar seguro. Podrás restaurarlo más adelante.</p><div class="row"><button class="btn" onclick="exportData()">⬇ Exportar respaldo</button><label class="btn secondary" style="margin:0;cursor:pointer">⬆ Importar respaldo<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><p class="footer">La sincronización entre dispositivos todavía no está activa. No borres los datos del navegador sin hacer antes un respaldo.</p></section>`}$('#content').innerHTML=html;bindForms()}
function go(p){page=p;render();scrollTo(0,0)}function bindForms(){let f=$('#taskForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));change(()=>state.tasks.push({id:uid(),...x,done:false,finished:''}));toast('Tarea guardada')};f=$('#habitForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(e.currentTarget);change(()=>state.habits.push({id:uid(),name:String(x.get('name')),done:''}))};f=$('#problemForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));change(()=>state.problems.push({id:uid(),...x}))};f=$('#clientForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));if(state.clients.some(c=>c.ruc===x.ruc)){toast('El RUC ya existe');return}change(()=>state.clients.push({id:uid(),...x}));toast('Cliente guardado')};f=$('#obligationForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));if(!x.clientId)return;change(()=>state.obligations.push({id:uid(),...x}));toast('Obligación guardada')}}
function toggleTask(id,done){change(()=>{let t=state.tasks.find(x=>x.id===id);if(t){t.done=done;t.finished=done?today():''}})}function moveTask(id){change(()=>{let t=state.tasks.find(x=>x.id===id);if(t){t.date=tomorrow();t.done=false}});toast('Pasada a mañana')}function editTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let name=prompt('Descripción',t.title);if(name===null||!name.trim())return;let date=prompt('Fecha (AAAA-MM-DD)',t.date||today());if(date===null||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return;change(()=>{t.title=name.trim();t.date=date})}function deleteTask(id){if(confirm('¿Eliminar esta tarea?'))change(()=>state.tasks=state.tasks.filter(t=>t.id!==id))}function toggleHabit(id,done){change(()=>{let h=state.habits.find(x=>x.id===id);h.done=done?today():''})}function removeHabit(id){change(()=>state.habits=state.habits.filter(x=>x.id!==id))}function removeProblem(id){change(()=>state.problems=state.problems.filter(x=>x.id!==id))}function problemToTask(id){let p=state.problems.find(x=>x.id===id);change(()=>state.tasks.push({id:uid(),title:p.step,area:'Personal',priority:'media',date:today(),clientId:'',done:false,finished:''}));toast('Paso agregado a tareas')}function deleteClient(id){if(state.obligations.some(o=>o.clientId===id)){toast('Primero eliminá sus obligaciones');return}if(confirm('¿Eliminar cliente?'))change(()=>state.clients=state.clients.filter(c=>c.id!==id))}function updateObligation(id,status){change(()=>{let o=state.obligations.find(x=>x.id===id);o.status=status})}function deleteObligation(id){if(confirm('¿Eliminar obligación?'))change(()=>state.obligations=state.obligations.filter(o=>o.id!==id))}function closeDay(){let mood=$('#mood').value,reflection=$('#reflection').value;change(()=>{state.journal.push({id:uid(),date:today(),mood,reflection});state.tasks.forEach(t=>{if(!t.done&&(!t.date||t.date<=today()))t.date=tomorrow()})});toast('Revisión guardada; pendientes a mañana')}function saveHour(){change(()=>state.settings.reviewHour=$('#reviewHour').value);toast('Hora guardada')}function exportData(){let blob=new Blob([JSON.stringify({app:'mi-norte',version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-norte-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(el){let file=el.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='mi-norte'||!obj.data||!Array.isArray(obj.data.tasks)||!Array.isArray(obj.data.clients)||!Array.isArray(obj.data.habits)||!Array.isArray(obj.data.obligations))throw Error('Formato inválido');if(!confirm('¿Reemplazar todos los datos locales con este respaldo?'))return;state=obj.data;await save();render();toast('Respaldo restaurado')}catch(e){alert('No se pudo importar: '+e.message)}}function updateConnection(){$('#connection').textContent=navigator.onLine?'● Disponible sin conexión':'● Sin internet · datos locales'}window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));updateConnection();load().catch(e=>{$('#content').innerHTML='<section class="panel">No se pudo abrir el almacenamiento local. Probá desde HTTPS en un navegador actualizado.</section>';console.error(e)});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
